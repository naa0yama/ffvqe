---
name: push workflow
on: [push, workflow_dispatch]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  run:
    name: Python 3
    runs-on: ubuntu-latest
    env:
      OS: ubuntu-latest
      PYTHON_VERSION: "null"
      POETRY_VERSION: "null"

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Extract tool versions
        id: versions
        run: |
          set -eux

          cat .tool-versions

          PYTHON_VERSION=$(grep -oP '(?<=python\s).+' .tool-versions)
          if [ -z "$PYTHON_VERSION" ]; then
            exit 1
          fi

          POETRY_VERSION=$(grep -oP '(?<=poetry\s).+' .tool-versions)
          if [ -z "$POETRY_VERSION" ]; then
            exit 1
          fi

          dprint_version=$(grep -E '^ARG DPRINT_VERSION=v?[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | sed -E 's/ARG DPRINT_VERSION=(v?[0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          {
            echo "python_version=${PYTHON_VERSION}";
            echo "poetry_version=${POETRY_VERSION}";
            echo "dprint=${dprint_version}";
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python ${{ steps.versions.outputs.python_version }}
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ steps.versions.outputs.python_version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache tox environments
        id: cache-tox
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/pre-commit
            .tox
            .venv
          # pyproject.toml, poetry.lock and .pre-commit-config.yaml have versioning info that would
          # impact the tox environment.
          key: tox-${{ steps.versions.outputs.python_version }}-${{ hashFiles(
            'pyproject.toml',
            'poetry.lock',
            '.pre-commit-config.yaml',
            'tox.ini') }}

      - name: Install dependencies
        run: |
          set -eux

          python -m pip install --upgrade pip
          pip install poetry==${{ steps.versions.outputs.poetry_version }}

          poetry install --no-interaction

      - name: Run versions
        run: |
          set -eux

          pip --version
          poetry --version
          poetry env info

      - name: Install dprint
        uses: taiki-e/install-action@efd8b64311f7a0a9b888ed13d0df78ec9184c163 # v2.62.11
        with:
          tool: dprint@${{ steps.versions.outputs.dprint }}

      - name: Run tox
        run: |
          set -eux

          poetry run tox
